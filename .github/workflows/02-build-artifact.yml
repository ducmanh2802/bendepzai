---
name: "2. Build + artifact"
description: "Build `dist/`, chặn vượt bundle budget, tải artifact về xem thử"
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: "true"
jobs:
  build:
    name: build + bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build --silent

      - name: Bundle budget (main chunk <= 600 kB)
        run: npm run check:budget --silent

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.number || github.sha }}
          path: dist
          retention-days: 14
          if-no-files-found: error
